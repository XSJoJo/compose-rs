[package]
name = "compose-runtime"
description = "The composition runtime of compose-rs: slot table, composer, recompose scopes and state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
futures-core.workspace = true
log.workspace = true
compose-macros.workspace = true

[features]
# `tooling::CompositionObserver` (D1505): off by default, a pass then takes no step for it.
composition-observer = []

[dev-dependencies]
# Its own tests run with the observers on.
compose-runtime = { path = ".", features = ["composition-observer"] }

[lints]
workspace = true
