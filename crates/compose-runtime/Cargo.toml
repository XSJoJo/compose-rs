[package]
name = "compose-runtime"
description = "The composition runtime of compose-rs: slot table, composer, recompose scopes and state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
futures-core.workspace = true
log.workspace = true
compose-macros.workspace = true

[features]
# `tooling::CompositionObserver` (D1505): off by default, a pass then takes no step for it.
composition-observer = []
# `tooling::CompositionData` (D1509): off by default, a pass then takes no step for it.
composition-data = []

[dev-dependencies]
# Its own tests run with the tools on. A unit test in `src` naming `compose_runtime::…` would
# link this second copy, with thread-locals of its own: unit tests use `crate::`.
compose-runtime = { path = ".", features = ["composition-observer", "composition-data"] }

[lints]
workspace = true
